name: AI Red Team Assistant CI Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  backend-tests:
    name: Backend Unit, Security & Golden Integration Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Execute Backend Unit Tests
        run: |
          python -m unittest discover backend/tests -v

      - name: Execute Security & Guardrail Test Suite
        run: |
          python run_all_tests.py

      - name: Execute Golden Integration Workflow Test
        run: |
          python test_golden_project.py

  frontend-build:
    name: Frontend Typecheck & Production Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install Node Dependencies
        run: |
          npm ci

      - name: Run TypeScript Validation & Vite Build
        run: |
          npm run build
